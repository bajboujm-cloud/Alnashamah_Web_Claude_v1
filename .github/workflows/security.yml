# Free security checks for a private repository (no GitHub Advanced Security needed).
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # every Monday

permissions:
  contents: read

jobs:
  secrets:
    name: Leaked secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full git history for keys and passwords
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  sast:
    name: Code security (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan for security bugs
        run: >-
          semgrep scan --metrics off --error --severity ERROR
          --config p/typescript --config p/react --config p/nextjs --config p/secrets
          --exclude node_modules --exclude .next
          src scripts

  dependencies:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high
