name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nashamah
          POSTGRES_PASSWORD: nashamah
          POSTGRES_DB: nashamah
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U nashamah" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://nashamah:nashamah@localhost:5433/nashamah
      NEXT_TELEMETRY_DISABLED: "1"
      # Test-only value for the production build in CI; the real one lives in Vercel at go-live.
      AUTH_SECRET: ci-test-secret-not-used-anywhere-else-00000000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations are in sync with the schema
        run: pnpm exec drizzle-kit check
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
